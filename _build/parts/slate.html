<style>
/* ── Slate — the classic home list (RootView.ClassicHomeContent → SidebarCard/ListRow)
   Metrics ported from MinimalTasks/Design/DesignSystem.swift + App/RootView.swift:
   card radius 15pt, row padding 12pt, icon frame 24pt, icon 18pt, gap 12pt,
   divider inset 48pt, row title 17pt/medium, count 13pt/medium in a chipFill capsule,
   FAB 56pt inset 24pt, star #FFDC51 (dark), accent #008FFD.                         */

.c-slate{
  --_p: var(--p, 1);
  --line: var(--hairline, rgba(255,255,255,.11));
  --dim: var(--ink-2, rgba(255,255,255,.58));
  --blue: var(--accent, #008FFD);

  container-type: inline-size;
  position: relative;
  isolation: isolate;
  box-sizing: border-box;
  width: 100%;
  /* hard guard: nothing may ever push the page sideways at 360px. `clip` (not
     hidden) keeps this out of the scroll chain; the margin lets the card's
     ambient shadow and the entrance slides paint without being cut. */
  overflow-x: clip;
  overflow-y: visible;
  overflow-clip-margin: calc(var(--u, 1rem) * 1.5);
  max-width: 34rem;
  margin: 0 auto;
  font-family: var(--sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
  color: var(--ink, #fff);
  -webkit-font-smoothing: antialiased;
}
/* one app "point-ish" unit — 1rem at full stage width, floored so 360px stays legible.
   Declared on the CHILDREN: cq units never resolve against their own container. */
.c-slate > *{ --u: clamp(.8rem, 2.94cqw, 1rem); }
.c-slate *{ box-sizing: border-box; }

/* ── canvas: SlateAmbientWash — two same-hue accent pools, top-left broad, bottom-right echo */
.c-slate .wash{
  position: absolute; inset: calc(var(--u) * -1.4) 0 calc(var(--u) * -1.4);
  overflow: hidden; z-index: 0; pointer-events: none;
  opacity: clamp(0, calc(var(--_p) * 4), 1);
}
.c-slate .wash::before,
.c-slate .wash::after{
  content: ""; position: absolute; border-radius: 50%;
  will-change: transform;
}
.c-slate .wash::before{
  left: -34%; top: -46%; width: 118%; height: 108%;
  background: radial-gradient(closest-side circle,
      color-mix(in srgb, var(--blue) 30%, transparent),
      color-mix(in srgb, var(--blue) 9%, transparent) 55%,
      transparent 78%);
  animation: slate-drift 21s ease-in-out infinite;
}
.c-slate .wash::after{
  right: -32%; bottom: -34%; width: 96%; height: 88%;
  background: radial-gradient(closest-side circle,
      color-mix(in srgb, var(--blue) 19%, transparent),
      color-mix(in srgb, var(--blue) 5%, transparent) 58%,
      transparent 80%);
  animation: slate-drift 27s ease-in-out infinite reverse;
}
@keyframes slate-drift{
  0%, 100%{ transform: translate3d(0, 0, 0) scale(1); }
  50%     { transform: translate3d(2.5%, -2%, 0) scale(1.07); }
}

.c-slate .screen{ position: relative; z-index: 1; }

/* ── nav bar: the Liquid Glass toolbar pill (search + settings) */
.c-slate .top{
  display: flex; justify-content: flex-end;
  padding: 0 calc(var(--u) * .3) 0 0;
}
.c-slate .pill{
  display: flex; align-items: center;
  gap: calc(var(--u) * .55);
  padding: calc(var(--u) * .42) calc(var(--u) * .78);
  border-radius: 999px;
  border: 1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.018) 62%, rgba(255,255,255,0)),
    color-mix(in srgb, var(--blue) 7%, rgba(20,24,32,.55));
  backdrop-filter: blur(14px) saturate(1.5);
  -webkit-backdrop-filter: blur(14px) saturate(1.5);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 calc(var(--u) * .3) calc(var(--u) * .9) rgba(0,0,0,.42);
  color: var(--ink, #fff);
  --pin: clamp(0, calc((var(--_p) - .05) * 7), 1);
  opacity: var(--pin);
  transform: translate3d(0, calc((var(--pin) - 1) * var(--u) * .5), 0);
}
.c-slate .pill svg{ display: block; width: calc(var(--u) * 1.18); height: calc(var(--u) * 1.18); }
.c-slate .pill .sep{
  width: 1px; align-self: stretch;
  margin: calc(var(--u) * .08) calc(var(--u) * .1);
  background: var(--line);
}

/* ── wordmark */
.c-slate .wordmark{
  margin: calc(var(--u) * 1.15) 0 calc(var(--u) * .95);
  padding-left: calc(var(--u) * .12);
  font-family: var(--display, "Times New Roman", Georgia, serif);
  font-weight: 400;
  font-size: calc(var(--u) * 2.02);
  line-height: 1.05;
  letter-spacing: -.012em;
  color: var(--ink, #fff);
  --tin: clamp(0, calc(var(--_p) * 7), 1);
  opacity: var(--tin);
  transform: translate3d(calc((var(--tin) - 1) * var(--u)), 0, 0);
}

/* ── SidebarCard — glass slab, DS.Radius.card, specular top edge, elevation */
.c-slate .card{
  position: relative;
  border-radius: calc(var(--u) * 1.2);
  border: 1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.014) 40%, rgba(255,255,255,0) 100%),
    color-mix(in srgb, var(--blue) 9%, rgba(19,23,31,.72));
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.22),
    0 calc(var(--u) * 1) calc(var(--u) * 2.4) calc(var(--u) * -.9) rgba(0,0,0,.65);
  overflow: hidden;
  --cin: clamp(0, calc((var(--_p) - .02) * 8), 1);
  opacity: var(--cin);
  transform: translate3d(0, calc((var(--cin) - 1) * var(--u) * .7), 0);
}

/* ── ListRow */
.c-slate .row{
  --rin: clamp(0, calc((var(--_p) - .1 - var(--n) * .055) * 4.6), 1);
  position: relative;
  display: grid;
  grid-template-columns: calc(var(--u) * 1.5) 1fr auto;
  align-items: center;
  gap: calc(var(--u) * .75);
  padding: calc(var(--u) * .82) calc(var(--u) * .85);
  opacity: var(--rin);
  transform: translate3d(calc((var(--rin) - 1) * var(--u) * 1.4), 0, 0);
}
.c-slate .row + .row::before{
  content: ""; position: absolute; top: 0; left: calc(var(--u) * 3.1); right: 0; height: 1px;
  background: var(--line);
  transform: scaleX(var(--rin));
  transform-origin: left center;
  opacity: var(--rin);
}
.c-slate .row .g{
  display: block; justify-self: center;
  width: calc(var(--u) * 1.16); height: calc(var(--u) * 1.16);
  color: var(--dim);
  overflow: visible;
}
.c-slate .row .name{
  font-size: calc(var(--u) * 1.05);
  font-weight: 500;
  letter-spacing: -.006em;
  line-height: 1.25;
  color: var(--ink, #fff);
}

/* ── Today's star: fills #FFDC51 as its row lands */
.c-slate .star{ --sf: clamp(0, calc((var(--_p) - .27) * 7), 1); }
.c-slate .star .grey{ opacity: calc(1 - var(--sf)); }
.c-slate .star .lit{
  opacity: var(--sf);
  transform-box: fill-box; transform-origin: center;
  transform: scale(calc(.86 + .14 * var(--sf)));
}

/* ── CountBadge (.pill) — chipFill capsule, monospaced digits, counting up */
.c-slate .count{
  position: relative;
  display: inline-grid;
  place-items: center;
  padding: calc(var(--u) * .19) calc(var(--u) * .5);
  border-radius: 999px;
  background: rgba(255,255,255,.085);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
  font-size: calc(var(--u) * .82);
  font-weight: 500;
  line-height: 1.35;
  font-variant-numeric: tabular-nums;
  color: var(--dim);
  opacity: clamp(0, calc((var(--_p) - var(--rs)) * 26), 1);
}
.c-slate .count i{
  grid-area: 1 / 1;
  font-style: normal;
  --fs: calc(var(--rs) + var(--i) * var(--fw));
  --fe: calc(var(--fs) + var(--fw));
  opacity: calc(
    clamp(0, (var(--_p) - var(--fs)) * 90, 1) -
    clamp(0, (var(--_p) - var(--fe)) * 90, 1));
}
.c-slate .count i:last-child{
  opacity: clamp(0, calc((var(--_p) - var(--fs)) * 90), 1);
}

/* ── FAB — solid accent disc, pops in last with an overshoot */
.c-slate .fabwrap{
  display: flex; justify-content: flex-end;
  /* right inset must clear the halo ring at peak overshoot:
     halo 4.5u × its own 1.05 × the disc's 1.14 pop = 5.39u, i.e. .99u past the
     3.4u disc. .5u used to let it spill outside the component. */
  padding: calc(var(--u) * 1.3) calc(var(--u) * 1.05) calc(var(--u) * .35) 0;
}
.c-slate .fab{
  --in:   clamp(0, calc((var(--_p) - .70) * 7.4), 1);
  --back: clamp(0, calc((var(--_p) - .82) * 8.2), 1);
  position: relative;
  display: grid; place-items: center;
  width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4);
  border-radius: 50%;
  background:
    linear-gradient(180deg, color-mix(in srgb, #fff 16%, var(--blue)), var(--blue) 62%,
      color-mix(in srgb, #000 10%, var(--blue)));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.32),
    0 calc(var(--u) * .5) calc(var(--u) * 1.3) calc(var(--u) * -.32) color-mix(in srgb, var(--blue) 62%, transparent),
    0 calc(var(--u) * .18) calc(var(--u) * .5) rgba(0,0,0,.45);
  opacity: clamp(0, calc(var(--in) * 1.6), 1);
  transform: scale(calc(var(--in) * 1.14 - var(--back) * .14));
}
/* soft accent halo, ring-shaped so it never washes over the disc face */
.c-slate .fab::after{
  content: ""; position: absolute; inset: calc(var(--u) * -.55);
  border-radius: 50%;
  background: radial-gradient(closest-side circle,
      transparent 0 70%,
      color-mix(in srgb, var(--blue) 30%, transparent) 82%,
      transparent 100%);
  pointer-events: none;
  animation: slate-halo 6.5s ease-in-out infinite;
}
.c-slate .fab svg{
  width: calc(var(--u) * 1.34); height: calc(var(--u) * 1.34);
  color: #fff;
  transform: rotate(calc((1 - var(--in)) * -42deg));
}
@keyframes slate-halo{
  0%, 100%{ opacity: .5; transform: scale(.97); }
  50%     { opacity: .95; transform: scale(1.05); }
}

@media (prefers-reduced-motion: reduce){
  .c-slate{ --_p: 1; }
  .c-slate .wash::before,
  .c-slate .wash::after,
  .c-slate .fab::after{ animation: none; }
  .c-slate .fab::after{ opacity: .7; transform: none; }
}
</style>
