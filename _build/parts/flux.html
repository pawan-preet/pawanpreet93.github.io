<style>
/* ---------------------------------------------------------------------------
   Flux — the home screen, in two stages.

   Stage 1 (--p 0 → .5)  Water: the body of water rises to today's percentage,
                         its two sine surfaces drifting, the hero cut from glass.
   Stage 2 (--p .5 → 1)  Caffeine: the liquid morphs water → coffee and drains,
                         revealing the bedtime projection and the metabolism curve,
                         which draws itself left to right.

   Every colour, radius, size and string below is lifted from the app:
   Palette.swift, Typeface.swift, HistoryStyle.swift, GlassReadout.swift,
   WaterFillView.swift, AddControl.swift, GlassGlyph.swift, CaffeinePage.swift,
   CaffeineDetailView.swift, BedtimeCaffeine.swift.
   Everything is measured in --pt, one iOS point.
--------------------------------------------------------------------------- */

.c-flux {
  /* Sub-ranges of the scroll. */
  --rise:  clamp(0, calc((var(--p, 0) - 0.03) * 3.0), 1);
  --out1:  clamp(0, calc((var(--p, 0) - 0.42) * 12.0), 1);
  --morph: clamp(0, calc((var(--p, 0) - 0.40) * 6.0), 1);
  --drain: clamp(0, calc((var(--p, 0) - 0.44) * 4.5), 1);
  --in2:   clamp(0, calc((var(--p, 0) - 0.53) * 11.0), 1);
  --draw:  clamp(0, calc((var(--p, 0) - 0.64) * 3.85), 1);
  --fillp: clamp(0, calc((var(--p, 0) - 0.80) * 6.5), 1);
  --dot:   clamp(0, calc((var(--p, 0) - 0.875) * 11.0), 1);
  /* Every sub-range has to finish before --p reaches 1, or the finished state
     is never actually finished: 0.90 + 1/12 = 0.983. */
  --tail:  clamp(0, calc((var(--p, 0) - 0.90) * 12.0), 1);
  --enter: clamp(0, calc(var(--p, 0) * 9), 1);

  /* The liquid, morphing water → coffee. FillStyle.water / FillStyle.coffee. */
  --liq-front-top: color-mix(in srgb, #8FD6F4, #C69C71 calc(var(--morph) * 100%));
  --liq-front-bot: color-mix(in srgb, #2F97D6, #7C4F28 calc(var(--morph) * 100%));
  --liq-back-top:  color-mix(in srgb, #BFE6F7, #E0C3A3 calc(var(--morph) * 100%));
  --liq-back-bot:  color-mix(in srgb, #7CC7EC, #B98A5E calc(var(--morph) * 100%));
  --liq-hl:        rgba(255, 255, 255, calc(0.7 - var(--morph) * 0.15));
  /* Palette.ground dark → Palette.coffeeGround dark. */
  --liq-ground:    color-mix(in srgb, #0A141B, #150F0A calc(var(--morph) * 100%));
  /* Palette.accent dark → Palette.coffeeAccent dark; the panel's own accent leads. */
  --liq-tint:      color-mix(in srgb, var(--accent, #2C7FC4), #C89468 calc(var(--morph) * 100%));
  --liq-tint-hi:   color-mix(in srgb, var(--liq-tint), #fff 34%);
  /* Palette.coffeeLine dark — the curve and every caffeine figure. */
  --coffee-line: #E8B085;

  /* How high the water stands: 8% → 86% (today), then drained back to a
     shallow band of coffee under the caffeine page. */
  --level: calc((8 + var(--rise) * 78 - var(--drain) * 81) * 1%);

  display: grid;
  place-items: center;
  width: 100%;
}

.c-flux .fx-screen {
  --w: min(100cqw, calc(min(62svh, 34rem) * 0.8));
  --pt: calc(var(--w) / 380);
  position: relative;
  width: var(--w);
  max-width: 100%;
  aspect-ratio: 4 / 5;
  border-radius: calc(34 * var(--pt));
  overflow: hidden;
  isolation: isolate;
  background: var(--liq-ground);
  font-family: var(--sans);
  color: var(--ink);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.09),
    0 calc(26 * var(--pt)) calc(70 * var(--pt)) rgba(0, 0, 0, 0.72);
  opacity: calc(0.25 + var(--enter) * 0.75);
  transform: translateY(calc((1 - var(--enter)) * 18 * var(--pt))) scale(calc(0.972 + var(--enter) * 0.028));
}
.c-flux p { margin: 0; }

/* ---------- the liquid ---------- */

.c-flux .fx-liq {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--level);
  z-index: 0;
}
.c-flux .fx-layer { position: absolute; inset: 0; }
.c-flux .fx-back { opacity: 0.78; }
.c-flux .fx-fill { position: absolute; inset: 0; }
.c-flux .fx-front .fx-fill {
  background: linear-gradient(to bottom, var(--liq-front-top), var(--liq-front-bot));
}
.c-flux .fx-back .fx-fill {
  background: linear-gradient(to bottom, var(--liq-back-top), var(--liq-back-bot));
}

/* Two layered sine surfaces (WaveFill): the back one lighter, slower, and
   sitting six points lower for depth; the front one carries the highlight. */
.c-flux .fx-crest {
  --crest: calc(30 * var(--pt));
  position: absolute;
  left: 0;
  height: var(--crest);
  display: block;
  /* The shallow pool the coffee drains to carries a smaller swell than a full
     body of water does. Scaled about the midpoint, which is the waterline, so
     the swell flattens without the surface moving — and it is a transform, so
     nothing re-lays-out as it goes. */
  transform-origin: 50% 50%;
  transform: scaleY(calc(1 - var(--morph) * 0.5));
  will-change: translate;
}
.c-flux .fx-front .fx-crest {
  width: 200%;
  bottom: calc(100% - var(--crest) * 0.5);
  animation: fx-drift 9.5s linear infinite;
}
.c-flux .fx-back .fx-crest {
  width: 260%;
  bottom: calc(100% - var(--crest) * 0.667);
  animation: fx-drift 17s linear infinite reverse;
}
.c-flux .fx-front .fx-crest .body { fill: var(--liq-front-top); }
.c-flux .fx-back .fx-crest .body { fill: var(--liq-back-top); }
.c-flux .fx-crest .hl {
  stroke: var(--liq-hl);
  stroke-width: calc(1.6 * var(--pt));
  vector-effect: non-scaling-stroke;
}

/* The ambient drift rides the independent `translate` property so it composes
   with the scaleY above instead of overwriting it. */
@keyframes fx-drift { to { translate: -50% 0; } }

/* A whisper of light on the body of the water, so it is not a flat wash. */
.c-flux .fx-sheen {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(105% 55% at 24% 62%, rgba(255, 255, 255, 0.1), transparent 62%);
  opacity: calc(1 - var(--morph) * 0.6);
}

/* ---------- stage 1: water ---------- */

.c-flux .fx-water {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(14 * var(--pt)) calc(18 * var(--pt)) calc(22 * var(--pt));
  opacity: calc(1 - var(--out1));
  transform: translateY(calc(var(--out1) * -12 * var(--pt)));
  pointer-events: none;
}

.c-flux .fx-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}
.c-flux .fx-round {
  display: grid;
  place-items: center;
  width: calc(34 * var(--pt));
  height: calc(34 * var(--pt));
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.13);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(calc(14 * var(--pt)));
  -webkit-backdrop-filter: blur(calc(14 * var(--pt)));
  color: var(--liq-tint-hi);
}
.c-flux .fx-round svg { width: calc(17 * var(--pt)); height: calc(17 * var(--pt)); display: block; }

/* GlassReadout: the one number, with the amount line under it. */
.c-flux .fx-readout {
  margin-top: calc(44 * var(--pt));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(6 * var(--pt));
}
.c-flux .fx-hero {
  display: flex;
  align-items: baseline;
  gap: calc(1.6 * var(--pt));
  font-family: var(--mono);
  line-height: 1;
}
/* Type set in glass (Text.glassText): a nearly transparent body, a bright rim
   along the top edge and a rim in the page's own colour along the bottom. */
.c-flux .fx-hero span {
  color: rgba(255, 255, 255, 0.19);
  text-shadow:
    0 calc(-1.8 * var(--pt)) 0 rgba(255, 255, 255, 0.93),
    0 calc(1.8 * var(--pt)) 0 color-mix(in srgb, var(--liq-tint) 55%, transparent),
    0 calc(3 * var(--pt)) calc(4 * var(--pt)) rgba(0, 0, 0, 0.16);
}
.c-flux .fx-hero .v { font-size: calc(82 * var(--pt)); letter-spacing: -0.02em; }
.c-flux .fx-hero .u { font-size: calc(27.9 * var(--pt)); }

/* Set in caps by style, not by shouting in the markup, so a screen reader reads
   "of" as a word rather than spelling it. */
.c-flux .fx-amount {
  font-family: var(--mono);
  font-size: calc(15 * var(--pt));
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: rgba(255, 255, 255, 0.95);
  text-shadow: 0 1px calc(2.5 * var(--pt)) rgba(0, 0, 0, 0.28);
  white-space: nowrap;
}

.c-flux .fx-spacer { flex: 1 1 auto; min-height: calc(10 * var(--pt)); }

/* AddControl: the chevron, the glass FAB, and undo at the trailing edge. */
.c-flux .fx-add {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(14 * var(--pt));
}
.c-flux .fx-chevron {
  display: block;
  width: calc(15 * var(--pt));
  height: calc(15 * var(--pt));
  color: var(--liq-tint);
}
.c-flux .fx-fabrow {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
.c-flux .fx-fab {
  display: grid;
  place-items: center;
  width: calc(76 * var(--pt));
  height: calc(76 * var(--pt));
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.34);
  border: 1px solid rgba(255, 255, 255, 0.42);
  backdrop-filter: blur(calc(18 * var(--pt))) saturate(1.7);
  -webkit-backdrop-filter: blur(calc(18 * var(--pt))) saturate(1.7);
  box-shadow:
    0 calc(8 * var(--pt)) calc(14 * var(--pt)) rgba(0, 0, 0, 0.16),
    inset 0 1px 0 rgba(255, 255, 255, 0.55);
}
.c-flux .fx-fab svg {
  width: calc(40 * var(--pt));
  height: calc(40 * var(--pt));
  display: block;
  fill: none;
  stroke: var(--liq-tint);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.c-flux .fx-undo {
  position: absolute;
  right: 0;
  display: grid;
  place-items: center;
  width: calc(40 * var(--pt));
  height: calc(40 * var(--pt));
  border-radius: 50%;
  background: color-mix(in srgb, var(--liq-tint) 20%, transparent);
  border: 1px solid color-mix(in srgb, var(--liq-tint) 68%, transparent);
  backdrop-filter: blur(calc(14 * var(--pt)));
  -webkit-backdrop-filter: blur(calc(14 * var(--pt)));
  color: var(--liq-tint);
}
.c-flux .fx-undo svg { width: calc(16 * var(--pt)); height: calc(16 * var(--pt)); display: block; }

/* ---------- stage 2: caffeine ---------- */

.c-flux .fx-caff {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(15 * var(--pt));
  padding: calc(13 * var(--pt)) calc(18 * var(--pt));
  opacity: var(--in2);
  transform: translateY(calc((1 - var(--in2)) * 16 * var(--pt)));
  pointer-events: none;
}
/* HistoryAura: two soft blurred blobs of the metric colour behind the cards. */
.c-flux .fx-aura {
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(58% 40% at 18% 10%, rgba(200, 148, 104, 0.3), transparent 70%),
    radial-gradient(52% 36% at 92% 34%, rgba(200, 148, 104, 0.18), transparent 72%);
}
.c-flux .fx-navtitle {
  text-align: center;
  font-size: calc(17 * var(--pt));
  font-weight: 600;
  letter-spacing: -0.005em;
  margin-bottom: calc(2 * var(--pt));
}

/* .historyCard() — a frosted pane at the section radius. */
.c-flux .fx-card {
  border-radius: calc(28 * var(--pt));
  padding: calc(15 * var(--pt));
  /* iOS `.regular` glass over a dark ground: a dark frost, not a light wash —
     it has to lift the plot off the coffee that rises behind it. */
  background:
    linear-gradient(rgba(255, 255, 255, 0.085), rgba(255, 255, 255, 0.045)),
    rgba(19, 13, 9, 0.62);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(calc(22 * var(--pt))) saturate(1.5);
  -webkit-backdrop-filter: blur(calc(22 * var(--pt))) saturate(1.5);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.07),
    0 calc(10 * var(--pt)) calc(26 * var(--pt)) rgba(0, 0, 0, 0.34);
}

/* HSectionCaption: all-caps, semibold, tracked 1.4. */
.c-flux .fx-cap {
  font-size: calc(12 * var(--pt));
  font-weight: 600;
  letter-spacing: calc(1.4 * var(--pt));
  text-transform: uppercase;
  color: var(--ink-2);
}
.c-flux .fx-caprow { display: flex; align-items: baseline; justify-content: space-between; gap: calc(10 * var(--pt)); }
.c-flux .fx-time {
  font-size: calc(12 * var(--pt));
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink-3);
}

.c-flux .fx-fig {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--pt));
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.c-flux .fx-fig .n { font-weight: 700; color: var(--coffee-line); }
.c-flux .fx-fig .mg { font-weight: 500; color: var(--ink-2); }
.c-flux .fx-tonight .fx-fig { margin-top: calc(11 * var(--pt)); }
.c-flux .fx-tonight .fx-fig .n { font-size: calc(44 * var(--pt)); }
.c-flux .fx-tonight .fx-fig .mg { font-size: calc(18 * var(--pt)); }
.c-flux .fx-sub {
  margin-top: calc(4 * var(--pt));
  font-size: calc(13 * var(--pt));
  color: var(--ink-2);
}
.c-flux .fx-band {
  margin-top: calc(11 * var(--pt));
  font-size: calc(15 * var(--pt));
  font-weight: 600;
  color: var(--ink);
}
.c-flux .fx-banddetail {
  margin-top: calc(4 * var(--pt));
  font-size: calc(12.5 * var(--pt));
  line-height: 1.36;
  color: var(--ink-2);
}

.c-flux .fx-body .fx-fig { margin-top: calc(9 * var(--pt)); }
.c-flux .fx-body .fx-fig .n { font-size: calc(34 * var(--pt)); }
.c-flux .fx-body .fx-fig .mg { font-size: calc(15 * var(--pt)); }

/* ---------- the metabolism curve ---------- */

.c-flux .fx-chart { display: block; width: 100%; height: auto; margin-top: calc(9 * var(--pt)); overflow: visible; }
.c-flux .fx-chart text { font-family: var(--sans); }
.c-flux .fx-yl { font-size: 11px; fill: rgba(255, 255, 255, 0.5); }
.c-flux .fx-xl { font-size: 11px; font-weight: 500; fill: #C89468; }

/* The fill washes in behind the finished line, never ahead of it. */
.c-flux .fx-area {
  fill: url(#fluxArea);
  opacity: var(--fillp);
}
.c-flux .fx-fillmask { width: calc(var(--fillp) * 228px); }
/* The solid line draws itself left to right; pathLength normalises it to 100. */
.c-flux .fx-line {
  fill: none;
  stroke: var(--coffee-line);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 100px;
  stroke-dashoffset: calc((1 - var(--draw)) * 100px);
  opacity: clamp(0, calc(var(--draw) * 40), 1);
}
/* Solid to now, dashed ahead — the app admitting the future is a projection. */
.c-flux .fx-proj {
  fill: none;
  stroke: color-mix(in srgb, var(--coffee-line) 68%, transparent);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-dasharray: 3 4;
}
.c-flux .fx-tailmask { width: calc(var(--tail) * 60px); }
.c-flux .fx-rule {
  fill: none;
  stroke: rgba(255, 255, 255, 0.26);
  stroke-width: 1;
  stroke-dasharray: 4 4;
  opacity: var(--in2);
}
.c-flux .fx-bed {
  fill: none;
  stroke: rgba(200, 148, 104, 0.55);
  stroke-width: 1;
  stroke-dasharray: 2 3;
  opacity: var(--in2);
}
.c-flux .fx-moon { fill: rgba(200, 148, 104, 0.8); opacity: var(--in2); }
.c-flux .fx-nowdot {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  transform: scale(calc(0.4 + var(--dot) * 0.6));
  opacity: var(--dot);
}
.c-flux .fx-nowdot .halo { fill: color-mix(in srgb, var(--coffee-line) 30%, transparent); }
.c-flux .fx-nowdot .core { fill: var(--coffee-line); }

/* ---------- reduced motion: pinned to the finished state ---------- */

@media (prefers-reduced-motion: reduce) {
  .c-flux {
    --rise: 1; --morph: 1; --drain: 1; --out1: 1; --in2: 1;
    --draw: 1; --fillp: 1; --dot: 1; --tail: 1; --enter: 1;
  }
  /* Both crest selectors have to be spelled out: the loops are declared on
     `.fx-front .fx-crest` / `.fx-back .fx-crest`, so a bare `.fx-crest` here is
     a specificity step down and the drift keeps running. */
  .c-flux .fx-front .fx-crest,
  .c-flux .fx-back .fx-crest {
    animation: none;
    translate: none;
    will-change: auto;
  }
}
</style>

<div class="c-flux">
  <div class="fx-screen">

    <!-- One shared body of liquid, morphing water into coffee. -->
    <div class="fx-liq" aria-hidden="true">
      <div class="fx-layer fx-back">
        <div class="fx-fill"></div>
        <svg class="fx-crest" viewBox="0 0 480 30" preserveAspectRatio="none" focusable="false">
          <path class="body" d="M0,17 q30,16 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 L480,30 L0,30 Z"/>
        </svg>
      </div>
      <div class="fx-layer fx-front">
        <div class="fx-fill"></div>
        <svg class="fx-crest" viewBox="0 0 480 30" preserveAspectRatio="none" focusable="false">
          <path class="body" d="M0,15 q30,-22 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 L480,30 L0,30 Z"/>
          <path class="hl" fill="none" d="M0,15 q30,-22 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0"/>
        </svg>
      </div>
    </div>
    <div class="fx-sheen" aria-hidden="true"></div>

    <!-- Stage 1 — water -->
    <div class="fx-water">
      <div class="fx-bar" aria-hidden="true">
        <span class="fx-round">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M3.6 12a8.4 8.4 0 1 0 2.6-6.1"/>
            <path d="M3.2 3.4v3.9h3.9"/>
            <path d="M12 7.6V12l3 1.8"/>
          </svg>
        </span>
        <span class="fx-round">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" focusable="false">
            <path d="M3 6.5h18M3 12h18M3 17.5h18"/>
            <circle cx="8.5" cy="6.5" r="2.1" fill="currentColor" stroke="none"/>
            <circle cx="15.5" cy="12" r="2.1" fill="currentColor" stroke="none"/>
            <circle cx="9.5" cy="17.5" r="2.1" fill="currentColor" stroke="none"/>
          </svg>
        </span>
      </div>

      <div class="fx-readout">
        <p class="fx-hero"><span class="v">86</span><span class="u">%</span></p>
        <p class="fx-amount">2.28 L of 2.65 L</p>
      </div>

      <div class="fx-spacer"></div>

      <div class="fx-add" aria-hidden="true">
        <svg class="fx-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="M5 15.5 12 8.5l7 7"/>
        </svg>
        <div class="fx-fabrow">
          <span class="fx-fab">
            <!-- GlassGlyph: a tapered tumbler with a waterline. -->
            <svg viewBox="0 0 100 100" focusable="false">
              <path d="M24 16 L34 84 Q35 89 40 90 L60 90 Q65 89 66 84 L76 16 L24 16"/>
              <path d="M28 44 Q36 38 44 44 Q52 50 60 44 Q66 39 72 44"/>
            </svg>
          </span>
          <span class="fx-undo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M8.5 7.5H14a5.5 5.5 0 0 1 0 11h-4"/>
              <path d="M11.5 4 8 7.5 11.5 11"/>
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- Stage 2 — caffeine -->
    <div class="fx-caff">
      <div class="fx-aura" aria-hidden="true"></div>

      <p class="fx-navtitle">Caffeine</p>

      <div class="fx-card fx-tonight">
        <div class="fx-caprow">
          <span class="fx-cap">Tonight</span>
          <span class="fx-time">1:00 AM</span>
        </div>
        <p class="fx-fig"><span class="n">52</span><span class="mg">mg</span></p>
        <p class="fx-sub">still in you at bedtime</p>
        <p class="fx-band">May cost you sleep</p>
        <p class="fx-banddetail">Enough to lengthen how long you take to fall asleep and trim deep sleep.</p>
      </div>

      <div class="fx-card fx-body">
        <span class="fx-cap">In your body now</span>
        <p class="fx-fig"><span class="n">85</span><span class="mg">mg</span></p>

        <svg class="fx-chart" viewBox="0 0 312 106" role="img"
             aria-label="Estimated caffeine in your body through today: low overnight, a spike after midday to about 220 milligrams, then a decay to 52 milligrams at bedtime.">
          <defs>
            <linearGradient id="fluxArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#E8B085" stop-opacity="0.38"/>
              <stop offset="1" stop-color="#E8B085" stop-opacity="0.02"/>
