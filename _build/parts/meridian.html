<style>
/* Meridian — the Instrument screen. Tokens transcribed from
   Meridian/DESIGN_SYSTEM.md §2.1 (dark appearance), §3.2, §4.1–§4.3
   and the shipped land-dot lattice (Packages/MeridianGlobe/.../land_dots.bin). */
.c-meridian{
  /* 1 iOS point == 0.06795em here: the card is 390pt wide at 26.5em. */
  --ink:#E8E5DE;                  /* DS §2.1 ink, dark */
  --muted:#8F8B82;                /* DS §2.1 inkMuted, dark */
  --faint:#3A3833;                /* DS §2.1 inkFaint, dark — decorative only */
  --sig:var(--accent,#F49A3A);    /* DS §2.1 signal / signalInk, dark */
  --pp:clamp(0,var(--p,0),1);
  display:flex; justify-content:center; align-items:flex-start;
  width:100%; container-type:inline-size;
  font-family:var(--sans,"Figtree",system-ui,sans-serif);
  -webkit-font-smoothing:antialiased;
}
.c-meridian *{box-sizing:border-box;}

.c-meridian .m-in{
  font-size:clamp(8px,min(3.4cqw,1.55svh),16px);
  width:100%; max-width:26.5em;
  padding:0.6em 1.0872em 0.4em;      /* DS §4.1 Spacing.l screen inset */
  color:var(--ink);
  /* --p-derived ramps: every one of them is a pure function of scroll progress */
  --e0:clamp(0,calc((var(--pp) - 0.02) * 7),1);
  --e1:clamp(0,calc((var(--pp) - 0.07) * 7),1);
  --e2:clamp(0,calc((var(--pp) - 0.11) * 6),1);
  --e3:clamp(0,calc((var(--pp) - 0.18) * 6),1);
  --e4:clamp(0,calc((var(--pp) - 0.24) * 4),1);
  --e5:clamp(0,calc((var(--pp) - 0.44) * 7),1);
  --e6:clamp(0,calc((var(--pp) - 0.12) * 4),1);
  --e7:clamp(0,calc((var(--pp) - 0.52) * 5),1);
}

/* ---------- identity ---------- */
.c-meridian .m-city{
  font-size:1.495em; font-weight:500; line-height:1.06;
  letter-spacing:0.0636em; text-transform:uppercase;
  font-stretch:112%; font-variation-settings:"wdth" 112;
  opacity:var(--e0);
  transform:translateY(calc((1 - var(--e0)) * 0.5em));
}
.c-meridian .m-meta{
  display:flex; align-items:baseline; gap:0.5436em;
  margin-top:0.2718em;
  opacity:var(--e1);
  transform:translateY(calc((1 - var(--e1)) * 0.45em));
}
.c-meridian .m-meta span{
  font-size:0.7474em; font-weight:600; line-height:1.25;
  letter-spacing:0.182em; text-transform:uppercase;
  color:var(--muted);
  font-stretch:112%; font-variation-settings:"wdth" 112;
}
.c-meridian .m-meta .m-hm{color:var(--sig);}

/* ---------- the hero ---------- */
.c-meridian .m-hero{
  display:flex; align-items:baseline; gap:0.5436em;
  margin-top:0.5436em;
  opacity:var(--e2);
  transform:translateY(calc((1 - var(--e2)) * 0.6em));
}
.c-meridian .m-digits{
  font-size:4.6206em; font-weight:600; line-height:1;
  letter-spacing:-0.0221em; font-variant-numeric:tabular-nums;
  font-stretch:112%; font-variation-settings:"wdth" 112;
}
.c-meridian .m-mer{
  font-size:1.0192em; font-weight:600; letter-spacing:0.1067em;
  text-transform:uppercase; font-stretch:112%; font-variation-settings:"wdth" 112;
}

/* ---------- date + ambient weather ---------- */
.c-meridian .m-second{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:0.8154em; margin-top:0.2718em; color:var(--muted);
  opacity:var(--e3);
  transform:translateY(calc((1 - var(--e3)) * 0.5em));
}
.c-meridian .m-date{
  font-size:0.8154em; letter-spacing:0.0167em; text-transform:uppercase;
  font-variant-numeric:tabular-nums;
}
.c-meridian .m-wx{display:flex; align-items:center; gap:0.2718em; font-size:1.1552em;}
.c-meridian .m-wx svg{width:1.15em; height:1.04em; display:block; fill:currentColor;}
.c-meridian .m-temp{font-weight:500; font-variant-numeric:tabular-nums; line-height:1;}

/* ---------- SunBar (DS §9.1) ---------- */
.c-meridian .m-sun{margin-top:0.5436em;}
.c-meridian .m-track{
  position:relative; width:100%; container-type:inline-size;
  clip-path:inset(0 calc((1 - var(--e4)) * 100%) 0 0);
}
.c-meridian .m-track svg{display:block; width:100%; height:auto;}
.c-meridian .m-rule{stroke:var(--faint); stroke-width:1; vector-effect:non-scaling-stroke;}
.c-meridian .m-day{
  fill:none; stroke:var(--faint); stroke-width:1.5;
  stroke-linecap:round; stroke-linejoin:round;      /* Metrics.arcStrokeWidth 1.5 */
}
.c-meridian .m-nite{
  fill:none; stroke:var(--faint); stroke-width:2;   /* dotDiameter 2, dotPitch 8 */
  stroke-linecap:round; stroke-dasharray:0 8;
}
/* The track is its own query container, so 1cqw is 1% of the track and the
   marker rides the arc on transform alone — never left/top, which would ask
   for layout on every scroll frame. */
.c-meridian .m-mark{
  position:absolute; left:0; top:0;
  --f:calc(0.79 + clamp(0,calc((var(--pp) - 0.35) * 1.55),1) * 0.0996);
  --h:calc((1 + cos((var(--f) - 0.518) * 360deg)) / 2);
  width:0.4757em; height:0.4757em; border-radius:50%;
  border:0.102em solid var(--sig);                  /* hollow: the sun is down */
  transform:translate(calc((0.977 + var(--f) * 98.045) * 1cqw - 50%),
                      calc((68.5 - var(--h) * 65) * 0.06795em - 50%));
  opacity:var(--e5);
}
.c-meridian .m-ends{
  position:relative; height:1.0em; margin-top:0.2718em;
  opacity:var(--e5);
}
.c-meridian .m-ends span{
  position:absolute; top:0; transform:translateX(-50%);
  font-size:0.8154em; letter-spacing:0.0167em; color:var(--muted);
  white-space:nowrap; font-variant-numeric:tabular-nums;
}
.c-meridian .m-ends .m-r{left:25.22%;}
.c-meridian .m-ends .m-s{left:78.32%;}
.c-meridian .m-cap{
  margin-top:0.2718em; text-align:center;
  font-size:0.7474em; font-weight:600; line-height:1.25;
  letter-spacing:0.182em; text-transform:uppercase; color:var(--muted);
  font-stretch:112%; font-variation-settings:"wdth" 112;
  opacity:var(--e5);
}

/* ---------- the dot globe ---------- */
.c-meridian .m-globe{
  margin:1.6308em auto 0;
  width:19.03em; height:19.03em;                    /* Metrics.globeNominalDiameter 280 */
  position:relative;
  opacity:var(--e6);
  transform:scale(calc(0.945 + var(--e6) * 0.055));
}
.c-meridian .m-orb{position:absolute; inset:0;}

/* one Fibonacci lattice, resampled from the shipped land_dots.bin */
.c-meridian .m-sphere{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  --l0:calc(-52.3 + var(--pp) * 60);                /* the view drifts east: 52.3W to 7.7E */
  transform:rotateX(-12deg) rotateY(calc(var(--l0) * -1deg));
}
.c-meridian .m-sphere i{
  position:absolute; left:50%; top:50%;
  width:0.185em; height:0.185em; margin:-0.0925em 0 0 -0.0925em;
  border-radius:50%; background:var(--ink);
  backface-visibility:hidden;
  transform:rotateY(calc(var(--o) * 1deg)) rotateX(calc(var(--a) * 1deg)) translateZ(9.515em);
}

/* the limb: dots fade toward the horizon, as in GlobeRender */
.c-meridian .m-vig{
  position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    rgba(0,0,0,0) 36%, rgba(0,0,0,.15) 68%, rgba(0,0,0,.34) 87%, rgba(0,0,0,.50) 100%);
}

/* The terminator, as GlobeProjection.illumination defines it. A point is lit when
   p·s > 0; on an orthographic disc that boundary is the ellipse
       u²/sz² + v² = 1
   with v across the sun's horizontal bearing and u along it. With the sun in front
   (sz > 0) the night side is the far half-plane MINUS that ellipse — one rotated
   element: a linear ramp for the half-plane, a radial mask for the ellipse.
   Black at 0.75 turns an `ink` dot into an `inkFaint` one exactly, and the ramp
   through it lands on `inkMuted` — the twilight bucket, for free. */
.c-meridian .m-night{
  position:absolute; inset:0; border-radius:50%; overflow:hidden; opacity:.70;
  /* subsolar longitude relative to the view; declination 13.8°, viewer lat 12°N */
  --lam:calc(-28deg - var(--pp) * 60deg);
  --sx:calc(0.9711 * sin(var(--lam)));
  --sy:calc(0.2333 - 0.2019 * cos(var(--lam)));
  --sz:calc(0.0496 + 0.9498 * cos(var(--lam)));
  --ang:atan2(calc(0 - var(--sy)),var(--sx));
}
.c-meridian .m-ne{
  position:absolute; left:50%; top:50%; width:160%; height:160%;
  background:linear-gradient(270deg,transparent 48.4%,#000 51.6%);
  /* No static fallback below: a var() the engine can't resolve is invalid at
     computed-value time, which drops the property to its initial value rather
     than to an earlier declaration — the "fallback" would never have run. */
  transform:translate(-50%,-50%) rotate(var(--ang));
  -webkit-mask-image:radial-gradient(calc(var(--sz) * 9.515em) 9.515em at 50% 50%,transparent 0 94%,#000 100%);
  mask-image:radial-gradient(calc(var(--sz) * 9.515em) 9.515em at 50% 50%,transparent 0 94%,#000 100%);
}

/* markers — the one accent on the sphere */
.c-meridian .m-marks{position:absolute; inset:0; transform-style:preserve-3d;
  transform:rotateX(-12deg) rotateY(calc((-52.3 + var(--pp) * 60) * -1deg));
  opacity:var(--e7);}
.c-meridian .m-marks b{
  position:absolute; left:50%; top:50%;
  width:0.2664em; height:0.2664em; margin:-0.1332em 0 0 -0.1332em;
  border-radius:50%; background:var(--sig);
  backface-visibility:hidden;
  transform:rotateY(calc(var(--o) * 1deg)) rotateX(calc(var(--a) * 1deg)) translateZ(9.56em);
}
.c-meridian .m-marks b.m-me{
  width:0.4757em; height:0.4757em; margin:-0.2379em 0 0 -0.2379em;
}
/* the subject's ring, resting — GlobeRender draws it at 0.85 scale, 0.45 opacity */
.c-meridian .m-marks b.m-me::before{
  content:""; position:absolute; left:50%; top:50%;
  width:1.502em; height:1.502em; margin:-0.751em 0 0 -0.751em;
  border:0.058em solid var(--sig); border-radius:50%; opacity:.42;
}
.c-meridian .m-marks b.m-me s{
  position:absolute; left:50%; top:50%;
  width:1.7667em; height:1.7667em; margin:-0.8834em 0 0 -0.8834em;
  border:0.045em solid var(--sig); border-radius:50%;
  opacity:.45; transform:scale(.85);
  animation:c-meridian-pulse 2.6s ease-in-out infinite;
}
@keyframes c-meridian-pulse{
  0%{transform:scale(.85); opacity:.45;}
  70%{transform:scale(1.55); opacity:0;}
  100%{transform:scale(1.55); opacity:0;}
}
.c-meridian .m-limb{
  position:absolute; inset:0; border-radius:50%;
  border:1px solid var(--faint);
}

@media (prefers-reduced-motion:reduce){
  .c-meridian .m-in{--pp:1;}
  .c-meridian .m-marks b.m-me s{animation:none; transform:scale(1); opacity:.45;}
}
</style>
