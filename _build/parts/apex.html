<style>
/* ------------------------------------------------------------------
   Apex — Race Home (NextRaceHeroCard + Race Control field)
   Tokens lifted from FormulaOne/ApexUI/DesignSystem.swift:
     field ramp  #D40402 #C90301 #5C0603 #2E0403 #160606 #0A0304
                 at 0 / .22 / .34 / .44 / .56 / .78
     raceRed (dark)  #FF2800      glassStroke  rgba(255,255,255,.14)
     inkTertiary     #9C998F      inkSecondary #CBC8C2
     Radius.card 14pt on a 329pt card  ->  ~1.5rem here
   Circuit geometry is the app's own pipeline run offline over
   ApexCore/Resources/circuits.geojson (nl-1948, Zandvoort):
   equirectangular projection -> unit box -> RDP simplify 0.0015 ->
   oriented clockwise -> 720-sample curvature corner detection ->
   straight-run fit for the two 2025 DRS zones.
   ------------------------------------------------------------------ */

.c-apex {
  --ax-p: var(--p, 1);                      /* never shadows the ancestor */
  --ax-red: #FF2800;                        /* DS.Colors.raceRed, dark */
  --ax-edge: rgba(255, 255, 255, .14);      /* DS.Colors.glassStroke, dark */
  --ax-draw: clamp(0, calc(var(--ax-p) / .44), 1);
  --ax-zone: clamp(0, calc((var(--ax-p) - .44) * 7), 1);

  container-type: inline-size;
  position: relative;
  isolation: isolate;
  width: 100%;
  max-width: 34rem;
  margin-inline: auto;
  /* the app's card is a phone screen, not a square: hold that proportion so
     the near-square circuit fills the map instead of floating in it */
  aspect-ratio: .82;
  max-height: 100%;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ---- the field: Race Control's red-to-black ground ---------------- */
.c-apex .ax-field {
  position: absolute;
  /* no horizontal bleed: an absolutely positioned box hung outside the
     component still counts as layout overflow and scrolls the page on a
     narrow screen. The wash is faded out by its own mask instead. */
  inset: -8% 0 -6%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(78% 42% at 50% -4%, rgba(255, 92, 64, .55), rgba(255, 92, 64, 0) 72%),
    radial-gradient(126% 82% at 50% -14%, rgba(0, 0, 0, 0) 26%, rgba(0, 0, 0, .44) 100%),
    linear-gradient(180deg,
      var(--accent) 0%,
      var(--accent) 20%,
      #5C0603 34%,
      #2E0403 44%,
      #160606 56%,
      #0A0304 78%,
      #000 100%);
  /* fades on all four sides inside the box, so the ground has no hard edge */
  -webkit-mask-image: radial-gradient(52% 108% at 50% 0%, #000 44%, rgba(0, 0, 0, 0) 100%);
          mask-image: radial-gradient(52% 108% at 50% 0%, #000 44%, rgba(0, 0, 0, 0) 100%);
}

/* ---- stack -------------------------------------------------------- */
.c-apex .ax-stack {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: .85em;
  padding: .9em .55em 0;
  font-family: var(--sans);
  font-size: clamp(.68rem, 2.86cqw, .95rem);
  line-height: 1.25;
}

/* ---- top bar: the round red glass settings button ----------------- */
.c-apex .ax-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex: 0 0 auto;
}

.c-apex .ax-gear {
  width: 2.55em;
  height: 2.55em;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: rgba(255, 255, 255, .88);
  background:
    radial-gradient(120% 120% at 30% 12%, rgba(255, 255, 255, .20), rgba(255, 255, 255, 0) 62%),
    color-mix(in srgb, var(--accent) 55%, rgba(0, 0, 0, .35));
  box-shadow:
    inset 0 0 0 1px var(--ax-edge),
    inset 0 .06em .5em rgba(255, 255, 255, .14),
    0 .3em 1.2em rgba(255, 40, 0, .28);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
          backdrop-filter: blur(12px) saturate(1.2);
  opacity: clamp(0, calc(var(--ax-p) * 12), 1);
  transform: scale(calc(.86 + .14 * clamp(0, calc(var(--ax-p) * 9), 1)));
}
.c-apex .ax-gear svg { width: 1.18em; height: 1.18em; display: block; }

/* ---- the hero card ------------------------------------------------ */
.c-apex .ax-card {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-radius: 1.5rem;
  overflow: hidden;
  background:
    linear-gradient(168deg,
      rgba(255, 40, 0, .26) 0%,
      rgba(150, 14, 10, .20) 26%,
      rgba(22, 6, 6, .62) 62%,
      rgba(10, 3, 4, .82) 100%);
  box-shadow: inset 0 0 0 1px var(--ax-edge);
  -webkit-backdrop-filter: blur(22px) saturate(1.15);
          backdrop-filter: blur(22px) saturate(1.15);
}

/* ---- the neon track map ------------------------------------------- */
.c-apex .ax-map {
  position: relative;
  flex: 1 1 auto;
  min-height: 7.5em;
  padding: 1.05em 1em .45em;
}
.c-apex .ax-map svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* the veil that sinks the stroke into the card (DS surfaceFade) */
.c-apex .ax-map::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg,
    rgba(10, 3, 4, 0) 0%,
    rgba(10, 3, 4, 0) 74%,
    rgba(10, 3, 4, .55) 100%);
}

.c-apex .ax-ghost {
  fill: none;
  stroke: rgba(255, 255, 255, .13);
  stroke-width: 17;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: calc(clamp(0, calc(var(--ax-p) * 16), 1) * .9);
}

.c-apex .ax-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1 1;
  stroke-dashoffset: calc(1 - var(--ax-draw));
}
.c-apex .ax-line--emberglow { stroke: var(--ax-red); stroke-width: 30; opacity: .38; filter: url(#axBlurWide); }
.c-apex .ax-line--glow      { stroke: #fff;          stroke-width: 21; opacity: .48; filter: url(#axBlurSoft); }
.c-apex .ax-line--core      { stroke: #fff;          stroke-width: 19; }

/* the comet: a short dash pinned to the drawing head */
.c-apex .ax-head {
  fill: none;
  stroke-linecap: round;
  stroke-dasharray: .055 1;
  stroke-dashoffset: calc(.055 - var(--ax-draw));
  opacity: calc(1 - clamp(0, calc((var(--ax-draw) - .82) * 5.6), 1));
}
.c-apex .ax-head--halo { stroke: #fff; stroke-width: 44; opacity: calc((1 - clamp(0, calc((var(--ax-draw) - .82) * 5.6), 1)) * .5); filter: url(#axBlurWide); }
.c-apex .ax-head--tip  { stroke: #fff; stroke-width: 22; filter: url(#axBlurTight); }

/* ---- overtaking zones (2025 DRS: T13→T1 main straight, T10→T11) ---- */
.c-apex .ax-zones { opacity: var(--ax-zone); }
.c-apex .ax-zone {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.c-apex .ax-zone--spread { stroke: var(--ax-red); stroke-width: 58; opacity: .34; filter: url(#axBlurWide); animation: ax-breathe 4.6s ease-in-out infinite; }
.c-apex .ax-zone--core   { stroke: var(--ax-red); stroke-width: 38; opacity: .46; }

@keyframes ax-breathe { 0%, 100% { opacity: .26 } 50% { opacity: .46 } }

/* ---- annotations --------------------------------------------------- */
.c-apex .ax-anno { --ax-a: clamp(0, calc((var(--ax-p) - .45 - var(--n) * .017) * 13), 1); }
.c-apex .ax-num {
  font-family: var(--sans);
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -.02em;
  fill: #9C998F;               /* DS.Colors.inkTertiary, dark */
  text-anchor: middle;
  dominant-baseline: central;
  opacity: var(--ax-a);
}
.c-apex .ax-sf   { fill: var(--ax-red); opacity: var(--ax-a); }
.c-apex .ax-arrow { fill: #CBC8C2; opacity: calc(var(--ax-a) * .9); }

/* ---- copy block ---------------------------------------------------- */
.c-apex .ax-body { flex: 0 0 auto; padding: 0 1.1em 1.05em; }

.c-apex .ax-in {
  opacity: clamp(0, calc((var(--ax-p) - .40 - var(--n) * .046) * 9), 1);
  transform: translateY(calc(.72em * (1 - clamp(0, calc((var(--ax-p) - .40 - var(--n) * .046) * 9), 1))));
}

.c-apex .ax-meta {
  display: flex;
  align-items: center;
  gap: .5em;
  font-size: .74em;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  margin: 0 0 .34em;
}
.c-apex .ax-round { color: rgba(255, 255, 255, .93); }
.c-apex .ax-country { color: var(--ink-2); }

/* Netherlands — real flag colours, not the app tint */
.c-apex .ax-flag {
  width: 1.55em;
  height: 1.06em;
  border-radius: .17em;
  flex: 0 0 auto;
  background: linear-gradient(180deg, #AE1C28 0 33.34%, #FFF 33.34% 66.67%, #21468B 66.67% 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .34);   /* DS.Colors.flagEdge */
}

.c-apex .ax-name {
  margin: 0;
  font-size: 1.72em;
  font-weight: 800;
  letter-spacing: .012em;
  line-height: 1.03;
  color: var(--ink);
}

.c-apex .ax-dates {
  margin: .34em 0 0;
  font-size: .8em;
  color: var(--ink-2);
}

.c-apex .ax-count {
  position: relative;
  margin: .5em 0 0;
  display: flex;
  align-items: baseline;
  gap: .5em;
  flex-wrap: wrap;
}
.c-apex .ax-clock {
  font-family: var(--mono);
  font-size: 1.95em;
  font-weight: 400;
  letter-spacing: -.022em;
  line-height: 1.05;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.c-apex .ax-to { font-size: .8em; color: var(--ink-2); }

/* the odometer: one digit per ramp, discrete because the ramps are steep */
.c-apex .ax-dg { position: relative; display: inline-block; }
.c-apex .ax-dg > b { font-weight: inherit; visibility: hidden; }
.c-apex .ax-dg > i {
  position: absolute;
  inset: 0;
  font-style: normal;
  opacity: calc(
    clamp(0, calc((var(--ax-p) - var(--a)) * 400), 1) -
    clamp(0, calc((var(--ax-p) - var(--b)) * 400), 1)
  );
}

.c-apex .ax-rule {
  height: 1px;
  margin: .82em 0 .68em;
  background: var(--hairline);
  transform-origin: left center;
  transform: scaleX(clamp(0, calc((var(--ax-p) - .60) * 5), 1));
}

.c-apex .ax-stats { display: flex; align-items: flex-start; }
.c-apex .ax-stat {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  padding-inline: .9em;
}
.c-apex .ax-stat:first-child { padding-inline-start: 0; }
.c-apex .ax-stat:last-child  { padding-inline-end: 0; }
.c-apex .ax-stat + .ax-stat::before {
  content: "";
  position: absolute;
  left: 0;
  top: .12em;
  width: 1px;
  height: 2.55em;
  background: var(--hairline);
  transform-origin: top center;
  transform: scaleY(clamp(0, calc((var(--ax-p) - .66) * 7), 1));
}
.c-apex .ax-k {
  display: block;
  font-size: .76em;
  color: var(--ink-2);
  white-space: nowrap;
}
.c-apex .ax-v {
  display: block;
  margin-top: .12em;
  font-family: var(--mono);
  font-size: .95em;
  font-weight: 600;
  letter-spacing: -.03em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.c-apex .ax-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  .c-apex { --ax-p: 1; }
  .c-apex .ax-zone--spread { animation: none; opacity: .34; }
}
</style>
