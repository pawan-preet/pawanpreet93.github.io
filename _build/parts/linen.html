<style>
/* the printed cover, from the app's own render */
.c-linen .print{
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block;
}
/* ── Linen · the SHELF: a case-bound Volume, seen from directly above ───────
   Tokens lifted from LinenVolumes:
     LinenCore/LinenTheme.swift      paper(dark) #211D18 · paperDim #2A251F
                                     bookShadow(dark) black .85 · chipFill #302A22
                                     Spring tone #D6CBB8 · Summer tone #E6DECD
     Screens/Volumes/VolumeBookCover.swift
                                     aspectRatio 0.72 · Board.radius 3
                                     hingeFraction .075 (max 26) · headLight 2.5
                                     footDepth 12 · foreEdgeDepth 10
                                     CoverInset side 28 / bottom 30 · rule 0.75pt
                                     square 7 (case over block, flush at the spine)
                                     tailBand · dome · rakingLight · hingeBand
                                     reproduced stop for stop
                                     Foil.face ramp — specular · band · re-catch ·
                                     turned face — struck at the photograph's own
                                     hue (terracotta, s .30)
                                     die(.raised): hard bite +.5/+.6 black .20,
                                     hard lit lip -.5/-.5 white .48, then one seat
                                     bookDepth(): four passes, x:y held at ~0.6
     LinenCore/CoverStyle.swift      .didone = Gloock 34 / folio 17, tracking .010
                                     default station: foot, flush left
     Screens/Volumes/VolumeStage.swift
                                     one scalar, smoothstepped: the board breaks
                                     the latch and turns about the GROOVE FLOOR
                                     (66% across the hinge band) under a long lens;
                                     it loses light as it turns off the key, and the
                                     cast shadow blooms as the book leaves the shelf
   The cover photograph is a CSS scene — this component ships no images. */

.c-linen{
  --P: clamp(0, var(--p, 1), 1);

  /* the shelf's ground: warm charcoal, never pure black */
  --ground:   #211D18;
  --ground-2: #17130F;
  --tone:     #D6CBB8;   /* Spring — warm greige, the seasonal cast */
  --tone-2:   #E6DECD;   /* Summer — bone, the volume below         */

  /* Foil.face(hue: terracotta, saturation: .30) — HSB→RGB, topLeading→bottomTrailing */
  --foil: linear-gradient(135deg,
            #FCF1EC 0%, #F0D4C8 34%, #A17F70 55%, #F9E2D8 70%, #C7A698 100%);

  /* arrival · the swing · the volume behind */
  --enter: clamp(0, calc(var(--P) * 6), 1);
  --o: clamp(0, calc((var(--P) - 0.17) * 2.15), 1);
  --open: calc(var(--o) * var(--o) * (3 - 2 * var(--o)));      /* smoothstep */
  --s: clamp(0, calc((var(--P) - 0.34) * 2.05), 1);
  --sec: calc(var(--s) * var(--s) * (3 - 2 * var(--s)));
  /* THE LIFT — a triangle peaking mid-swing: the book comes off the shelf
     before it opens, exactly as VolumeStageCard.lift does */
  --lift: min(clamp(0, calc(var(--P) * 7), 1), clamp(0, calc((0.62 - var(--P)) * 3.4), 1));

  position: relative;
  width: 100%;
  max-width: 34rem;
  aspect-ratio: 1 / 1.02;
  max-height: 62svh;
  margin-inline: auto;
  overflow: hidden;
  container-type: size;
  isolation: isolate;
}
.c-linen,
.c-linen *,
.c-linen *::before,
.c-linen *::after{ box-sizing: border-box; }
/* NB: the root keeps its own margin-inline: auto — reset the children only */
.c-linen *{ margin: 0; padding: 0; }

/* the paper the shelf is printed on */
.c-linen .ground{
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(74% 56% at 50% 40%,
      color-mix(in srgb, var(--ground) 88%, var(--accent, #7A7264)) 0%,
      var(--ground) 36%, var(--ground-2) 68%, #0A0806 100%);
}
.c-linen .ground::after{      /* ONE key: upper-left, ~35° */
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(60% 46% at 24% 12%, rgba(255,246,232,.085), transparent 70%);
  opacity: calc(1 - 0.45 * var(--open));
}

/* ── the shelf ─────────────────────────────────────────────────────────── */
.c-linen .shelf{
  --S: min(100cqw, 100cqh);
  --BH: calc(var(--S) * 0.77);
  --BW: calc(var(--BH) * 0.72);        /* VolumeBookCover aspectRatio 0.72 */
  --R: calc(var(--BW) * 0.0064);       /* Board.radius 3 / 470             */
  --HB: calc(var(--BW) * 0.070);       /* hinge: min(w * .075, 26)         */
  --SQ: calc(var(--BW) * 0.0149);      /* the square: 7pt of case overhang */
  --SP: calc(1 + 1.05 * var(--lift) + 0.5 * var(--open));   /* shadow spread */

  position: absolute; inset: 0; z-index: 1;
}
.c-linen .vol{
  position: absolute;
  left: 50%; margin-left: calc(var(--BW) * -0.5);
  width: var(--BW); height: var(--BH);
}
.c-linen .v1{
  top: 5%;
  transform: translateY(calc((1 - var(--enter)) * 3.5%));
  opacity: calc(0.72 + 0.28 * var(--enter));
}
/* LazyVStack(spacing: 60) — 60 over 653pt of book */
.c-linen .v2{
  top: calc(5% + var(--BH) + var(--BH) * 0.092);
  transform: translateY(calc((1 - var(--sec)) * 14%));
  opacity: calc(0.3 + 0.7 * var(--sec));
}

/* ── the text block: gathered signatures, jogged, cut, cased in ────────── */
/* Squares at head, tail and fore-edge; FLUSH at the spine. It carries the
   book's cast shadow, so the shadow stays on the shelf while the board turns. */
.c-linen .block{
  position: absolute;
  left: 0; right: var(--SQ); top: var(--SQ); bottom: var(--SQ);
  border-radius: calc(var(--R) * 0.4);
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(28,20,13,.74) 0%, rgba(28,20,13,.30) 34%, rgba(28,20,13,.10) 68%, rgba(28,20,13,.04) 100%),
    linear-gradient(180deg, #CFC5B0 0%, #C2B7A0 44%, #A79B85 82%, #857A67 100%);
  box-shadow:
    calc(var(--BW) * 0.0021 * var(--SP)) calc(var(--BW) * 0.0032 * var(--SP))
      calc(var(--BW) * 0.0032 * var(--SP)) rgba(0,0,0,calc(0.95 - 0.35 * var(--lift))),
    calc(var(--BW) * 0.0064 * var(--SP)) calc(var(--BW) * 0.0085 * var(--SP))
      calc(var(--BW) * 0.0106 * var(--SP)) rgba(0,0,0,calc(0.55 + 0.30 * var(--lift))),
    calc(var(--BW) * 0.0149 * var(--SP)) calc(var(--BW) * 0.0234 * var(--SP))
      calc(var(--BW) * 0.0340 * var(--SP)) rgba(0,0,0,calc(0.36 + 0.28 * var(--lift))),
    calc(var(--BW) * 0.0170 * var(--SP)) calc(var(--BW) * 0.0380 * var(--SP))
      calc(var(--BW) * 0.0640 * var(--SP)) rgba(0,0,0,calc(0.22 + 0.22 * var(--lift)));
}
/* the cut fore-edge: the only place the leaves are actually countable */
.c-linen .block .edge{
  position: absolute; top: 0; bottom: 0; right: 0;
  width: calc(var(--BW) * 0.022);
  background:
    linear-gradient(90deg, rgba(74,60,42,.00) 0%, rgba(74,60,42,.34) 100%),
    repeating-linear-gradient(0deg,
      rgba(120,100,74,.13) 0 .5px, rgba(252,247,236,.15) .5px 1.5px);
}
/* the shut board's shadow, ON the block: the page begins in the dark, and the
   light ARRIVES as the board rises (VolumeStageCard, "the reveal") */
.c-linen .block .gutter{
  position: absolute; inset: 0;
  background: linear-gradient(90deg,
    rgba(0,0,0,.42) 0%, rgba(0,0,0,.26) 26%, rgba(0,0,0,.12) 62%, rgba(0,0,0,.05) 100%);
  opacity: calc(1 - 0.55 * var(--open));
}

/* ── the board ─────────────────────────────────────────────────────────── */
.c-linen .board{
  position: absolute; inset: 0;
  overflow: hidden;
  border-radius: var(--R);
  transform-origin: 4.62% 50%;         /* THE GROOVE FLOOR: 66% across the hinge */
  /* a long lens — a copy stand. The near edge bulges past the block, exactly as
     it does on the stage, and the board keeps its own vanishing point at the joint. */
  transform: perspective(calc(var(--BW) * 6)) rotateY(calc(var(--open) * -19deg));
  background: var(--tone);
}
.c-linen .l{ position: absolute; inset: 0; pointer-events: none; }

/* ── the photograph: a hillside town, printed edge to edge ─────────────── */

/* shuttered windows — four openings, cut as one gradient. (Percentages are
