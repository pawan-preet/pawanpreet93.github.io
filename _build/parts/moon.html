<style>
/* ── Moon · Today ─────────────────────────────────────────────────────────
   Recreated from MoonPhases: Theme.swift (palette, spacing), StarfieldView
   (sky gradient), MoonShaderSource (Lommel–Seeliger lighting + earthshine),
   DateScrubberView (tick metrics), GlassTagView, BottomDrawerView.
   Everything moves from --p and nothing else.                            */

.c-moon {
  --m-accent: var(--accent, #7c86b8);
  /* DateScrubberView needle / today dot: Theme.Palette.accent = #6ba3ff */
  --m-pin: #6ba3ff;
  --m-pin: color-mix(in srgb, var(--m-accent) 46%, #6ba3ff);
  /* StarfieldView.style: top rgb(.02,.02,.045) → bottom rgb(.03,.045,.085) */
  --m-sky-top: #05050b;
  --m-sky-bot: #080b16;

  position: relative;
  container-type: inline-size;
  /* the stage is roughly square and capped at 62svh, so the disc's own
     height budget caps the width too and nothing ever spills */
  width: min(100%, 34rem, 59svh);
  max-height: 100%;
  aspect-ratio: 1 / 1.04;
  margin-inline: auto;
  overflow: hidden;
  border-radius: 1.75rem;
  background:
    radial-gradient(120% 90% at 50% 8%, #0a0d1a 0%, rgba(10,13,26,0) 62%),
    linear-gradient(180deg, var(--m-sky-top) 0%, var(--m-sky-bot) 100%), #000;
  color: var(--ink, #fff);
  font-family: var(--sans, system-ui, sans-serif);
  display: flex;
  flex-direction: column;
  isolation: isolate;
}

/* ── sky ───────────────────────────────────────────────────────────────── */
.c-moon .sky { position: absolute; inset: -3%; z-index: 0; }
.c-moon .drift {
  position: absolute; inset: 0;
  animation: c-moon-drift 46s ease-in-out infinite alternate;
}
.c-moon .drift i {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  opacity: var(--o);
  animation-name: c-moon-tw;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  /* no will-change here on purpose: a running opacity animation is promoted
     by the compositor anyway, and 58 permanently-promoted layers is not a
     trade worth making — least of all under reduced motion, where they
     would stay promoted with nothing left to animate. */
}
.c-moon .drift i.sb {
  box-shadow: 0 0 0.28rem rgba(198,214,255,.55), 0 0 0.7rem rgba(160,186,255,.28);
}
@keyframes c-moon-tw {
  0%, 100% { opacity: var(--o); }
  50%      { opacity: calc(var(--o) * .34); }
}
@keyframes c-moon-drift {
  from { transform: translate(-0.55%, -0.4%); }
  to   { transform: translate( 0.55%,  0.4%); }
}

/* ── hero ──────────────────────────────────────────────────────────────── */
.c-moon .hero {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  /* the hero block centres in whatever the drawer leaves, as it does in
     TodayViewController's heroRegion */
  margin-top: auto;
  padding: 2.5cqw 5cqw 0;
}
.c-moon .orb {
  position: relative;
  width: 50cqw; aspect-ratio: 1;
  transform: scale(calc(.982 + .018 * var(--p, 0)));
}
.c-moon .glow {
  position: absolute; inset: -42%;
  border-radius: 50%;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(214,228,255,.20) 0%,
      rgba(150,175,240,.13) 22%,
      rgba(150,175,240,0) 52%),
    radial-gradient(circle at 50% 50%,
      color-mix(in srgb, var(--m-accent) 34%, transparent) 0%,
      color-mix(in srgb, var(--m-accent) 0%, transparent) 60%);
  opacity: calc(.14 + .86 * var(--p, 0));
  transform: translateX(calc((1 - var(--p, 0)) * 7%))
             scale(calc(.86 + .16 * var(--p, 0)));
}
.c-moon .disc {
  position: relative;
  display: block; width: 100%; height: 100%;
}

/* the terminator: an ellipse whose horizontal semi-axis runs
   +R (new) → 0 (first quarter) → −R (full). It is *scaled*, never resized:
   scaleX is a paint-time transform, whereas animating the rx geometry
   property would re-lay-out the SVG on every frame. Past zero the scale
   goes negative, which mirrors the ellipse onto itself — harmless, and it
   only happens once the matching mask has already faded out. */
.c-moon .term-a,
.c-moon .term-b { transform-box: view-box; transform-origin: 100px 100px; }
.c-moon .term-a { transform: scaleX(calc(1 - 2 * var(--p, 0))); }
.c-moon .term-b { transform: scaleX(calc(2 * var(--p, 0) - 1)); }
.c-moon .cap-new  { opacity: clamp(0, calc((0.035 - var(--p, 0)) * 40), 1); }
.c-moon .cap-full { opacity: clamp(0, calc((var(--p, 0) - 0.965) * 40), 1); }
.c-moon .lit-a  { opacity: clamp(0, calc((0.5005 - var(--p, 0)) * 900), 1); }
.c-moon .lit-b  { opacity: clamp(0, calc((var(--p, 0) - 0.4995) * 900), 1); }
.c-moon .maria   { mix-blend-mode: multiply; }
.c-moon .craters { mix-blend-mode: multiply; }
.c-moon .rays    { mix-blend-mode: screen; }

/* ── caption ───────────────────────────────────────────────────────────── */
.c-moon .caption { position: relative; z-index: 1; text-align: center; width: 100%; }
.c-moon .ph {
  position: absolute; inset-inline: 0; top: 0;
  --o: calc(clamp(0, (var(--p, 0) - var(--a)) * 120, 1)
          * clamp(0, (var(--b) - var(--p, 0)) * 120, 1));
  opacity: var(--o);
  transform: translateY(calc((1 - var(--o)) * .3rem));
}
.c-moon .names {
  position: relative;
  margin-top: 4.2cqw;                       /* 26pt under the disc */
  height: 1.16em;
  font-family: var(--display, Gloock, Georgia, serif);
  font-weight: 400;
  font-size: clamp(.95rem, 6.45cqw, 2.3rem);
  line-height: 1.16;
  letter-spacing: -0.005em;
  color: var(--ink, #fff);
  white-space: nowrap;
}
.c-moon .dates {
  position: relative;
  margin-top: 1.1cqw;                       /* 6pt */
  height: 1.35em;
  font-size: clamp(.58rem, 3.5cqw, 1.02rem);
  line-height: 1.35;
  color: var(--ink-2, rgba(255,255,255,.58));
  white-space: nowrap;
}
.c-moon .tag {                             /* GlassTagView: h24, r12, 11pt medium */
  display: inline-flex; align-items: center;
  margin-top: 1.85cqw;                      /* 10pt */
  height: clamp(1.02rem, 6.1cqw, 1.7rem);
  padding: 0 2.9cqw;
  border-radius: 3.1cqw;
  font-size: clamp(.52rem, 2.72cqw, .8rem);
  font-weight: 500;
  letter-spacing: .004em;
  color: rgba(255,255,255,.5);              /* not accented: the moon is down */
  background: rgba(255,255,255,.055);
  border: 1px solid var(--hairline, rgba(255,255,255,.11));
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
}

/* ── drawer head + scrubber ────────────────────────────────────────────── */
.c-moon .drawer {
  position: relative; z-index: 2;
  margin-top: auto;
  padding: 0 4cqw 1.4cqw;
  border-top: 1px solid rgba(255,255,255,.10);   /* BottomDrawerView topEdge */
  border-radius: 1.6rem 1.6rem 0 0;
  background: rgba(255,255,255,.038);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}
.c-moon .grab {
  width: 2.38rem; height: .32rem;                /* 38 x 5, r 2.5 */
  margin: clamp(.26rem, 1.5cqw, .55rem) auto .1rem;
  border-radius: .16rem;
  background: rgba(255,255,255,.35);
}
.c-moon .track {
  position: relative;
  height: clamp(2.35rem, 12.8cqw, 4.35rem);
  margin: 0 2.5%;
}
.c-moon .track i {
  position: absolute;
  left: calc(var(--n) / 31 * 100%);
  bottom: 38%;                                    /* baseY = 0.62 * height */
  width: 1.5px;
  border-radius: 1px;
  transform: translateX(-50%);
  background: #fff;
  /* base alpha 0.30 / 0.55 / 0.92, times the edge fade, plus a lift where
     the playhead is passing */
  --d: max(calc(var(--n) / 31 - var(--ph)), calc(var(--ph) - var(--n) / 31));
  --near: clamp(0, calc((.13 - var(--d)) * 9), 1);
  --ph: calc(.3226 + .4839 * var(--p, 0));        /* 11 Aug → 26 Aug */
}
.c-moon .track i.t1 { height: .46rem; opacity: calc(var(--f) * (.30 + .34 * var(--near))); }
.c-moon .track i.t2 { height: .79rem; opacity: calc(var(--f) * (.55 + .35 * var(--near))); }
.c-moon .track i.t3 { height: 1.16rem; width: 2px; opacity: calc(var(--f) * .92); }
.c-moon .track .ml,
.c-moon .track .dl {
  position: absolute;
  left: calc(var(--n) / 31 * 100%);
  top: calc(62% + .3rem);
  transform: translateX(-50%);
  font-weight: 500;
  text-decoration: none;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.c-moon .track .ml { font-size: clamp(.5rem, 2.25cqw, .68rem); color: rgba(255,255,255,.82); opacity: var(--f); }
.c-moon .track .dl { font-size: clamp(.46rem, 2cqw, .62rem);  color: rgba(255,255,255,.46); opacity: var(--f); }

.c-moon .today {                                 /* the accent dot on "now" */
  position: absolute;
  left: calc(14 / 31 * 100%);
  bottom: calc(38% + .82rem);
  width: .3rem; height: .3rem;
  margin-left: -.15rem;
  border-radius: 50%;
  background: var(--m-pin);
  opacity: calc(.4 + .6 * clamp(0, calc((.13 - max(calc(.4516 - var(--phh)), calc(var(--phh) - .4516))) * 9), 1));
  --phh: calc(.3226 + .4839 * var(--p, 0));
}
.c-moon .sweep {                                 /* travels 11 Aug → 26 Aug */
  position: absolute; inset: 0;
  transform: translateX(calc(var(--p, 0) * 48.39%));
}
.c-moon .head {                                  /* the glowing needle */
  position: absolute;
  left: 32.26%;
  bottom: calc(38% - .12rem);
  width: 3px; height: clamp(1.3rem, 6.2cqw, 1.72rem);
  margin-left: -1.5px;
  border-radius: 1.5px;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--m-pin) 40%, #fff) 0%,
    var(--m-pin) 42%,
    var(--m-pin) 100%);
  box-shadow: 0 0 .44rem color-mix(in srgb, var(--m-pin) 90%, transparent),
              0 0 1.1rem color-mix(in srgb, var(--m-pin) 45%, transparent);
}
.c-moon .head::after {
  content: "";
  position: absolute; left: 50%; top: -.33rem;
  width: .3rem; height: .3rem; margin-left: -.15rem;
  border-radius: 50%;
  background: color-mix(in srgb, var(--m-pin) 55%, #fff);
  box-shadow: 0 0 .4rem color-mix(in srgb, var(--m-pin) 80%, transparent);
}

@container (max-width: 22rem) {
  .c-moon .track .dl { opacity: calc(var(--f) * 1.35); }
}

@media (prefers-reduced-motion: reduce) {
  /* Pinned to the finished state: full moon, needle parked on 26 Aug.
     !important because the pin has to beat whatever wrote --p — site.js
     puts it on the ancestor panel today, but the component should stay
     honest if that ever moves onto the root itself. */
  .c-moon { --p: 1 !important; }
  /* Likewise: each star carries an inline animation-duration/-delay, so the
     shorthand needs !important to clear animation-name out from under them. */
  .c-moon .drift,
  .c-moon .drift i { animation: none !important; }
}
</style>
