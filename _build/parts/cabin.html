<style>
/* ── Cabin — the home screen (Cabin/Features/Home/HomeView.swift over PlaneZero).
   Every number here is ported, not invented:
     Typography.swift  display 36/bold/-0.5 · heroNumeral 68/black/-1.5 · heroUnit 24/semibold/.7α
                       caption 13/regular/.75α · micro 11 · nano 8/medium — SF Pro, width axis 0.32
     GlassRole.swift   Shapes.pill = capsule · Metrics: pillHeight 52, pillMinWidth 52,
                       compact hPadding 12, screenMargin 20 · Shapes.sheet r36
     LockSwitch.swift  width 56, cellHeight 62, puck inset 4, glyph 19/semibold
     GlassPill.swift   glyph 20/light, caption 8pt under it, height 52+12 with a caption
     AmbientTint.swift accent #E31937 (Tesla red, fixed) · base #2F3134 graphite
                       ink ladder 1 / .65 / .42 / .25
     ConnectionState   .waking → a travelling highlight, period 3.2s (the only ambient loop)
   Plane 0 is HeroTunnel.jpg — a red Model 3 in a lit concrete tunnel. No photograph here,
   so the tunnel is rebuilt as a pre-projected SVG: strip lights, wall streaks and lane
   lines already sitting at their real depth, marching at the viewer as --p advances.
   Every id in the artwork is cabin-prefixed so a second component cannot capture them.  */

.c-cabin{
  --_p: var(--p, 1);
  --red: #E31937;                      /* AmbientTint.accent — the car, and the one lock */
  --ink-1: var(--ink, #fff);
  --ink-65: rgba(255,255,255,.65);     /* InkLevel.secondary */
  --ink-42: rgba(255,255,255,.42);     /* InkLevel.tertiary  */
  --line: var(--hairline, rgba(255,255,255,.11));

  container-type: inline-size;
  position: relative;
  isolation: isolate;
  box-sizing: border-box;
  width: 100%;
  max-width: 34rem;
  margin: 0 auto;
  font-family: var(--sans, "Figtree", -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
  color: var(--ink-1);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.c-cabin *{ box-sizing: border-box; }

/* 1 app point ≈ 0.2545cqw (a 393pt screen across the stage), floored so 360px stays legible.
   Declared on the children: container units never resolve against their own container. */
.c-cabin > *{ --pt: max(.0455rem, .2545cqw); }

/* ── the screen ───────────────────────────────────────────────────────────── */
.c-cabin .screen{
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1.06;
  max-height: 100%;
  overflow: hidden;
  border-radius: calc(36 * var(--pt));   /* Shapes.sheet */
  background: #000;
  box-shadow: 0 0 0 1px var(--line), 0 calc(6 * var(--pt)) calc(30 * var(--pt)) rgba(0,0,0,.6);
}

/* ── Plane 0: the tunnel ──────────────────────────────────────────────────── */
.c-cabin .field{
  position: absolute; inset: 0;
  overflow: hidden;
  background: #040405;
}
/* the tunnel itself is a projected SVG: four planes meeting at the vanishing
   point, plus strip lights, wall smears and lane lines drawn at their real depth.
   Forward motion in a perspective projection IS a scale about the vanishing point,
   so the whole scene marches at the viewer on one rule. */
.c-cabin .tunnel{
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}
.c-cabin .mv{
  /* current depth: the camera advances 4.2m over the scroll */
  --zc: calc(var(--z0) - 4.2 * var(--_p));
  transform-box: view-box;
  transform-origin: 57% 43%;                /* the vanishing point */
  transform: scale(calc(var(--z0) / var(--zc)));
  opacity: calc(
    clamp(0, calc((62 - var(--zc)) / 16), 1) *
    clamp(0, calc((var(--zc) - 2) / 1.7), 1) *
    var(--o, 1));
  /* deliberately no will-change: there are 43 .mv nodes and promoting every one
     of them costs far more than it buys. The two big movers below opt in. */
}
/* the concrete smears as it goes past; the lane lines stay crisp */
.c-cabin .streak{ filter: blur(2.2px); }
.c-cabin .lane{ filter: blur(.5px); }

/* the car */
.c-cabin .car{
  position: absolute; left: 52.5%; bottom: 23.5%;
  width: 104%;
  transform: translateX(-50%) scale(calc(.93 + var(--_p) * .11));
  transform-origin: 50% 100%;
  filter: drop-shadow(0 1.4cqw 2.6cqw rgba(0,0,0,.62));
  will-change: transform;
}
/* the car is drawn, not photographed — so no cut-out mask, just kill the
   inline-baseline gap under the svg and let the viewBox set the height */
/* The photograph replaces the drawn car: fade its edges into the scene so it reads
   as depth rather than a pasted rectangle. */
.c-cabin .car img{
  display: block; width: 100%; height: auto;
  -webkit-mask-image: radial-gradient(130% 112% at 50% 54%, #000 44%, transparent 78%);
  mask-image: radial-gradient(130% 112% at 50% 54%, #000 44%, transparent 78%);
}
/* red bounce off the concrete, and the headlight wash on the floor */
.c-cabin .bounce{
  position: absolute; left: 52.5%; bottom: 19%;
  width: 54%; height: 12%;
  transform: translateX(-50%);
  background: radial-gradient(50% 62% at 50% 40%, rgba(227,25,55,.3), rgba(227,25,55,0) 74%);
  filter: blur(1cqw);
  opacity: calc(.4 + var(--_p) * .6);
}
.c-cabin .throw{
  position: absolute; left: 52.5%; bottom: 8%;
  width: 66%; height: 15%;
  transform: translateX(-50%);
  background:
    radial-gradient(30% 84% at 26% 0%, rgba(222,234,252,.26), rgba(222,234,252,0) 72%),
    radial-gradient(30% 84% at 74% 0%, rgba(222,234,252,.26), rgba(222,234,252,0) 72%);
  filter: blur(1.1cqw);
  opacity: calc(.3 + var(--_p) * .7);
}

/* vignette + the top fall-off the type sits in */
.c-cabin .veil{
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.86) 0%, rgba(0,0,0,.34) 22%, rgba(0,0,0,0) 42%),
    linear-gradient(0deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.16) 22%, rgba(0,0,0,0) 40%),
    radial-gradient(120% 88% at 50% 46%, rgba(0,0,0,0) 44%, rgba(0,0,0,.62) 100%);
}

/* ── Plane 1: the interface ───────────────────────────────────────────────── */
.c-cabin .ui{
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: calc(24 * var(--pt)) calc(20 * var(--pt)) calc(20 * var(--pt));
}

/* LegibilityScrim — inverse ink, radial, sized past the text bounds.
   isolation is load-bearing: without a stacking context of its own the z-index:-1
   pseudo escapes to .c-cabin and paints under .screen's opaque black, i.e. vanishes.
   (.charge got away with it only because its transform makes a context by accident.) */
.c-cabin .scrim{ position: relative; isolation: isolate; }
.c-cabin .scrim::before{
  content: ""; position: absolute; inset: -22% -10%;
  background: radial-gradient(closest-side, rgba(0,0,0,.42), rgba(0,0,0,0) 78%);
  z-index: -1; pointer-events: none;
}

/* header */
.c-cabin .head{ --r: clamp(0, calc(var(--_p) * 7), 1); }
.c-cabin .name{
  margin: 0;
  font-size: calc(36 * var(--pt));
  font-weight: 800;
  letter-spacing: -.014em;
  line-height: 1.02;
  opacity: var(--r);
  transform: translate3d(0, calc((1 - var(--r)) * 1.6cqw), 0);
}
.c-cabin .sub{
  margin: calc(4 * var(--pt)) 0 0;
  font-size: calc(13 * var(--pt));
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.28;
  color: rgba(255,255,255,.49);        /* caption .75α over InkLevel.secondary .65 */
  opacity: clamp(0, calc((var(--_p) - .03) * 7), 1);
  transform: translate3d(0, calc((1 - clamp(0, calc((var(--_p) - .03) * 7), 1)) * 1.2cqw), 0);
}
.c-cabin .stale{ font-size: calc(11 * var(--pt)); }

/* middle: LockSwitch + the hero value */
.c-cabin .mid{
  display: flex; align-items: center;
  gap: calc(18 * var(--pt));
  margin-top: calc(18 * var(--pt));
}

/* the glass recipe: GlassRole .clear — refracts Plane 0, never frosts it */
.c-cabin .glass{
  position: relative;
  background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.045));
  -webkit-backdrop-filter: blur(1.5cqw) saturate(1.35);
  backdrop-filter: blur(1.5cqw) saturate(1.35);
  box-shadow:
    inset 0 .14cqw 0 rgba(255,255,255,.26),
    inset 0 -.12cqw 0 rgba(255,255,255,.07),
    inset 0 0 0 .1cqw rgba(255,255,255,.13),
    0 .7cqw 1.8cqw rgba(0,0,0,.34);
}

.c-cabin .lock{
  flex: none;
  width: calc(56 * var(--pt));
  height: calc(124 * var(--pt));        /* 2 × cellHeight 62 */
  border-radius: 999px;
  display: flex; flex-direction: column;
  --r: clamp(0, calc((var(--_p) - .04) * 5), 1);
  opacity: var(--r);
  transform: translate3d(calc((var(--r) - 1) * 2.4cqw), 0, 0);
}
/* ConnectionState.waking — the travelling highlight, period 3.2s */
@property --cabin-a{ syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.c-cabin .lock::after{
  content: ""; position: absolute; inset: 0;
  border-radius: inherit; padding: .18cqw;
  background: conic-gradient(from var(--cabin-a, 0deg),
    rgba(255,255,255,0) 0 58%, rgba(255,255,255,.85) 72%, rgba(255,255,255,0) 84% 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  animation: cabin-wake 3.2s linear infinite;
  pointer-events: none;
}
@keyframes cabin-wake{ to{ --cabin-a: 360deg; } }

.c-cabin .cell{
  position: relative;
  flex: 1 1 0;
  display: grid; place-items: center;
}
.c-cabin .cell svg{
  position: relative; z-index: 1;
  width: calc(21 * var(--pt)); height: calc(21 * var(--pt));
}
.c-cabin .cell.off svg{ color: var(--ink-42); }
.c-cabin .cell.on  svg{ color: #fff; }
/* the puck: GlassRole.stateOn, tinted accent — the one red thing in the interface */
.c-cabin .puck{
  position: absolute; inset: calc(4 * var(--pt));
  border-radius: 999px;
  background: linear-gradient(180deg, #F0364F 0%, var(--red) 46%, #B5122B 100%);
  box-shadow:
    inset 0 .16cqw 0 rgba(255,255,255,.42),
    inset 0 -.14cqw 0 rgba(0,0,0,.28),
    0 .5cqw 1.5cqw rgba(227,25,55,.5);
  transform: scale(calc(.86 + clamp(0, calc((var(--_p) - .08) * 6), 1) * .14));
}

/* hero value */
.c-cabin .charge{
  --r: clamp(0, calc((var(--_p) - .08) * 5), 1);
  opacity: var(--r);
  transform: translate3d(0, calc((1 - var(--r)) * 1.8cqw), 0);
  min-width: 0;
}
.c-cabin .value{
  display: flex; align-items: flex-end;
  gap: calc(2 * var(--pt));
  font-weight: 900;
  font-size: calc(68 * var(--pt));
  letter-spacing: -.022em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
/* the count-up: one reel of 55 cells, stepped by round() so it lands on whole numbers */
.c-cabin .mask{
  --cell: 1em;
  --bp: clamp(0, calc((var(--_p) - .12) * 1.72), 1);
  display: block; height: var(--cell); overflow: hidden;
}
.c-cabin .reel{
  display: block;
  transform: translate3d(0, calc(var(--bp) * -54 * var(--cell)), 0);
  transform: translate3d(0, calc(round(down, calc(var(--bp) * 54), 1) * -1 * var(--cell)), 0);
  will-change: transform;
}
.c-cabin .reel i{
  display: block; height: var(--cell); line-height: var(--cell);
  text-align: right; font-style: normal;
}
.c-cabin .unit{
  font-size: calc(24 * var(--pt));
  font-weight: 600;
  letter-spacing: -.012em;
  line-height: 1;
  opacity: .7;                          /* TypeRole.heroUnit carries its own .7 */
  margin-bottom: calc(5.7 * var(--pt));
}
.c-cabin .range{
  margin: calc(2 * var(--pt)) 0 0;
  font-size: calc(13 * var(--pt));
  color: rgba(255,255,255,.49);
}

/* ── the control row ──────────────────────────────────────────────────────── */
.c-cabin .row{
  margin-top: auto;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: calc(6 * var(--pt));
}
.c-cabin .slot{
  --r: clamp(0, calc((var(--_p) - .42 - var(--n) * .06) * 5), 1);
  flex: 0 1 auto; min-width: 0;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: calc(2 * var(--pt));
  height: calc(64 * var(--pt));          /* pillHeight 52 + 12 for the caption */
  min-width: calc(52 * var(--pt));
  padding: 0 calc(12 * var(--pt));       /* isCompact */
  border-radius: 999px;
  opacity: var(--r);
  transform: translate3d(0, calc((1 - var(--r)) * 2.6cqw), 0) scale(calc(.92 + var(--r) * .08));
}
.c-cabin .slot svg{
  width: calc(20 * var(--pt)); height: calc(20 * var(--pt));
  flex: none;
}
.c-cabin .cap{
  font-size: max(.5rem, calc(8 * var(--pt)));
  font-weight: 500;
  line-height: 1.1;
  color: var(--ink-65);
  white-space: nowrap;
}
/* the readout pill: glyph + value on one line, caption under (GlassValuePill) */
.c-cabin .slot.readout{ flex: 0 1 auto; padding: 0 calc(11 * var(--pt)); }
.c-cabin .readout .line{
  display: flex; align-items: center; gap: calc(6 * var(--pt));
  font-size: calc(15 * var(--pt)); font-weight: 600; letter-spacing: -.008em;
  white-space: nowrap;
}
/* the charge meter: a hairline of accent along the foot of the battery pill */
.c-cabin .readout::after{
  content: ""; position: absolute;
  left: calc(16 * var(--pt)); bottom: calc(9 * var(--pt));
  height: .38cqw; border-radius: 999px;
  width: calc(clamp(0, calc((var(--_p) - .5) * 2.6), 1) * 54 * (100% - 32 * var(--pt)) / 100);
  background: linear-gradient(90deg, #F0364F, var(--red));
  box-shadow: 0 0 .9cqw rgba(227,25,55,.75);
}
.c-cabin .readout .track{
  position: absolute; left: calc(16 * var(--pt)); right: calc(16 * var(--pt));
  bottom: calc(9 * var(--pt)); height: .38cqw; border-radius: 999px;
  background: rgba(255,255,255,.16);
}
/* the battery glyph's own fill ramps with it */
.c-cabin .juice{
  transform-box: fill-box; transform-origin: left center;
  transform: scaleX(clamp(.06, calc((var(--_p) - .5) * 2.6 * .54), .54));
}

/* --p is pinned rather than --p's consumers: --_p is internal, so a host that drives
   the component with an inline style="--p:…" cannot out-specify this. */
@media (prefers-reduced-motion: reduce){
  .c-cabin{ --p: 1; --_p: 1; }
  .c-cabin .lock::after{ animation: none; }
}
</style>
